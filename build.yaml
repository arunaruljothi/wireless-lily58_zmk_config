# Uncomment the 'shield: nice_view' lines below if you are using nice!view displays.
# Additionally, you should enable the display feature in 'config/blelulu.conf'.
---
include:
  - board: blelulu_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_DISPLAY=y
    shield: nice_view
  - board: blelulu_right
    # shield: nice_view

  # Uncomment the following to build a "settings reset" firmware
  # to clear persistent settings (bluetooth connections, etc).
  # - board: blelulu_left
  #   shield: settings_reset
  # - board: blelulu_right
  #   shield: settings_reset
